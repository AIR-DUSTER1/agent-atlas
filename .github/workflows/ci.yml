# CI — 质量门（typecheck / 语法门 / 测试）
# 约束：不读真实 .env、不调真实模型、不访问用户 .web-config.json。
# 测试侧由 tests/helpers/server.ts 强制 mock 模式 + 临时端口 + 临时 journal/配置。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (server + client)
        run: npm run typecheck

      # 前端与桌面端源码已 TypeScript 化：语法正确性由 tsc 三配置覆盖，
      # 这里只需确认两侧的构建产物真的生成了（否则白屏/preload 失效而 CI 仍是绿的）
      - name: Build artifacts (client + desktop)
        run: |
          npm run build:client
          npm run build:desktop
          test -f src/server/public/main.js
          test -f src/server/public/index.html
          test -f src/server/public/styles/reset.css
          test -f src/server/public/styles/layout.css
          test -f src/server/public/styles/chat.css
          test -f src/server/public/styles/settings.css
          test -f src/server/public/styles/responsive.css
          test -f src/server/public/styles/tokens.css
          test -f src/server/public/styles/ui.css
          test -f src/server/public/vendor/chart.js
          test -f src/server/public/vendor/chart-lib.js
          test -f src/server/public/vendor/icons-lib.js
          test -f src/server/public/vendor/marked-lib.js
          test -f src/server/public/vendor/dompurify-lib.js
          test -f src/server/public/vendor/highlight-lib.js
          ! find src/server/public/vendor -name "*.map" -print -quit | grep -q .
          test -f desktop/build/main.js
          test -f desktop/build/preload.cjs

      - name: Tests (unit / integration / security)
        run: npm test
        env:
          # 双保险：即使 runner 上存在同名变量，也不允许测试触达真实网关
          API_KEY: ""
          AUTH_TOKEN: ""

      - name: Dependency audit (advisory)
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
        continue-on-error: true
