# CI — 质量、供应链、安全与生产镜像门禁
# 约束：不读真实 .env、不调真实模型、不访问用户 .web-config.json。
# 测试侧由 tests/helpers/server.ts 强制 mock 模式 + 临时端口 + 临时数据文件。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # main 合并门禁需要读取基线提交中的 package.json。
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Version specification consistency
        run: npm run version:check

      - name: Main merge version advance
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000')
        env:
          VERSION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: npm run version:main-guard

      - name: Project skill layering
        run: npm run skills:check

      - name: Typecheck (server + client + desktop)
        run: npm run typecheck

      - name: Build artifacts (client + desktop)
        run: |
          npm run build:client
          npm run build:desktop
          # 前端产物：入口是 Vite 原生单文件 HTML + assets/app.js；
          # 样式按页面分类到 styles/<group>/（tokens 在 styles/base/）。
          # vendor/ 自包含库已随 1:1 过渡树退役，第三方库改为 assets/ 下的懒加载 chunk。
          test -f src/server/public/index.html
          test -f src/server/public/build-info.json
          test -f src/server/public/assets/app.js
          test -f src/server/public/styles/base/tokens.css
          test -f src/server/public/styles/base/ui.css
          # 可选能力必须留在懒加载 chunk（不得进首屏 app.js）
          test -f src/server/public/assets/chart.js
          test -f src/server/public/assets/markdown.js
          test -f src/server/public/assets/highlight.js
          test -f src/server/public/assets/icons.js
          # 桌面端产物
          test -f desktop/build/main.js
          test -f desktop/build/preload.cjs
          # 产物里不得残留 sourcemap（泄露源码结构）。注意必须同时覆盖 assets/ 与
          # 可能重启的 vendor/：find 对不存在的目录会报错，配合 `!` 取反会变成
          # 永远通过 —— 旧断言正是这样假绿的。这里先判断目录存在再扫。
          for dir in src/server/public/assets src/server/public/vendor; do
            if [ -d "$dir" ]; then
              ! find "$dir" -name "*.map" -print -quit | grep -q .
            fi
          done

      - name: Tests (unit / integration / security)
        run: npm test
        env:
          API_KEY: ""
          AUTH_TOKEN: ""

      - name: Vue component tests
        run: npm run test:vue

      - name: Critical module coverage (security / persistence / auth routes)
        run: |
          npm run coverage:security
          npm run coverage:persistence
          npm run coverage:routes

      - name: Production dependency audit (block high/critical)
        run: npm run audit:prod
        env:
          NPM_AUDIT_REGISTRY: https://registry.npmjs.org

      - name: CycloneDX SBOM
        run: npm run sbom

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (mock, no model quota)
        run: npm run e2e
        env:
          API_KEY: ""
          AUTH_TOKEN: ""

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, e2e]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and smoke-test production image
        run: npm run image:smoke
        env:
          GIT_COMMIT: ${{ github.sha }}
          SMOKE_IMAGE: agent-ci:${{ github.sha }}
          SMOKE_KEEP_IMAGE: "1"

      - name: Trivy image scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: agent-ci:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-smoke-evidence
          path: artifacts/image-smoke.json
          if-no-files-found: error
          retention-days: 30
