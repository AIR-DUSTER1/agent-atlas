# CI — 质量、供应链、安全与生产镜像门禁
# 约束：不读真实 .env、不调真实模型、不访问用户 .web-config.json。
# 测试侧由 tests/helpers/server.ts 强制 mock 模式 + 临时端口 + 临时数据文件。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck (server + client + desktop)
        run: npm run typecheck

      - name: Build artifacts (client + desktop)
        run: |
          npm run build:client
          npm run build:desktop
          test -f src/server/public/main.js
          test -f src/server/public/index.html
          test -f src/server/public/styles/tokens.css
          test -f src/server/public/styles/ui.css
          test -f src/server/public/vendor/chart.js
          test -f src/server/public/vendor/chart-lib.js
          test -f src/server/public/vendor/icons-lib.js
          test -f src/server/public/vendor/marked-lib.js
          test -f src/server/public/vendor/dompurify-lib.js
          test -f src/server/public/vendor/highlight-lib.js
          test -f desktop/build/main.js
          test -f desktop/build/preload.cjs
          ! find src/server/public/vendor -name "*.map" -print -quit | grep -q .

      - name: Tests (unit / integration / security)
        run: npm test
        env:
          API_KEY: ""
          AUTH_TOKEN: ""

      - name: Critical module coverage (security / persistence / auth routes)
        run: |
          npm run coverage:security
          npm run coverage:persistence
          npm run coverage:routes

      - name: Production dependency audit (block high/critical)
        run: npm run audit:prod
        env:
          NPM_AUDIT_REGISTRY: https://registry.npmjs.org

      - name: CycloneDX SBOM
        run: npm run sbom

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: artifacts/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (mock, no model quota)
        run: npm run e2e
        env:
          API_KEY: ""
          AUTH_TOKEN: ""

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build and smoke-test production image
        run: npm run image:smoke
        env:
          GIT_COMMIT: ${{ github.sha }}
          SMOKE_IMAGE: agent-ci:${{ github.sha }}
          SMOKE_KEEP_IMAGE: "1"

      - name: Trivy image scan (advisory)
        uses: aquasecurity/trivy-action@0.28.0
        continue-on-error: true
        with:
          image-ref: agent-ci:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      - uses: actions/upload-artifact@v4
        with:
          name: image-smoke-evidence
          path: artifacts/image-smoke.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
