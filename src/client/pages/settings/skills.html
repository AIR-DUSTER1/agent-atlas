        <section id="settings-view-skills" class="settings-view hidden" data-settings-panel="skills" role="tabpanel" aria-labelledby="skills-title">
          <div id="skills-modal" class="skills-page" role="region" aria-labelledby="skills-title">
            <div class="skills-page-head">
              <h2 id="skills-title">技能</h2>
              <button id="skills-refresh-btn" type="button" class="skills-icon-btn" aria-label="刷新技能列表" title="刷新技能列表">
                <i class="ui-icon" data-icon="RefreshCw" aria-hidden="true"></i>
              </button>
            </div>

            <label class="skills-search-box">
              <i class="ui-icon" data-icon="Search" aria-hidden="true"></i>
              <input id="skills-search" type="search" aria-label="搜索技能" placeholder="搜索技能" autocomplete="off" />
            </label>

            <section class="skills-overview-card" aria-labelledby="skills-overview-title">
              <div class="skills-overview-copy">
                <h3 id="skills-overview-title">技能</h3>
                <p>技能是一组基于上下文触发的指令集，用于稳定执行专业任务。启用后仅在消息命中触发词或技能名称时载入，每轮最多 2 个。</p>
              </div>
              <div class="skills-overview-actions">
                <button id="skill-upload-btn" type="button" class="ghost-btn small skills-primary-btn">
                  <i class="ui-icon" data-icon="Upload" aria-hidden="true"></i> 上传技能
                </button>
              </div>
            </section>
            <input id="skill-upload-file" class="hidden" type="file" accept=".md,.markdown,text/markdown"
              multiple aria-label="选择技能文件" />
            <div id="skills-status" class="settings-status" role="status" aria-live="polite"></div>

            <div class="skills-list-toolbar">
              <div class="skills-filter-tabs" role="tablist" aria-label="技能状态筛选">
                <button type="button" class="skills-filter-tab active" data-skill-filter="all" role="tab" aria-selected="true">
                  全部 <span id="skills-count-all">0</span>
                </button>
                <button type="button" class="skills-filter-tab" data-skill-filter="enabled" role="tab" aria-selected="false">
                  已启用 <span id="skills-count-enabled">0</span>
                </button>
                <button type="button" class="skills-filter-tab" data-skill-filter="disabled" role="tab" aria-selected="false">
                  已禁用 <span id="skills-count-disabled">0</span>
                </button>
              </div>
              <div class="skills-list-summary">
                <span id="skills-count">共 0 个技能</span>
                <span id="skills-dir" class="skills-dir"></span>
              </div>
            </div>

            <div id="skills-list" class="skills-list"></div>
            <nav id="skills-pagination" class="skills-pagination hidden" aria-label="技能分页"></nav>
          </div>
        </section>
