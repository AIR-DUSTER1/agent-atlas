        <section id="settings-view-tracing" class="settings-view hidden" data-settings-panel="tracing" role="tabpanel" aria-labelledby="tracing-title">
          <div id="tracing-panel" class="routing-page" role="region" aria-labelledby="tracing-title">
            <div class="routing-head">
              <div>
                <span class="routing-kicker"><i class="ui-icon" data-icon="Activity" aria-hidden="true"></i> Observability</span>
                <h2 id="tracing-title"><i class="ui-icon" data-icon="Activity" aria-hidden="true"></i> 链路追踪</h2>
              </div>
              <label class="routing-switch" title="启用 LangSmith 链路追踪">
                <input id="tracing-enabled" type="checkbox" role="switch" aria-label="启用 LangSmith 链路追踪" />
                <span class="routing-switch-track" aria-hidden="true"></span>
                <span class="routing-switch-label" id="tracing-enabled-label">已停用</span>
              </label>
            </div>

            <div class="routing-grid">
              <section class="routing-card">
                <h3>LangSmith 配置</h3>
                <p class="routing-card-sub">开启后，每轮 Agent 的节点、工具和模型调用会异步上报到 LangSmith 云端。默认关闭，开启前请确认数据出网边界。</p>
                <label class="routing-field">
                  <span>上报后端</span>
                  <select id="tracing-backend" aria-label="追踪后端">
                    <option value="off">关闭（默认）</option>
                    <option value="langsmith">LangSmith 云端</option>
                  </select>
                </label>
                <label class="routing-field">
                  <span>项目名</span>
                  <input id="tracing-project" type="text" maxlength="120" spellcheck="false" placeholder="agentatlas" aria-label="LangSmith 项目名" />
                </label>
                <label class="routing-field">
                  <span>Endpoint</span>
                  <input id="tracing-endpoint" type="url" maxlength="400" spellcheck="false" placeholder="https://api.smith.langchain.com" aria-label="LangSmith Endpoint" />
                </label>
                <label class="routing-field">
                  <span>Agent ID</span>
                  <input id="tracing-agent-id" type="text" maxlength="120" spellcheck="false" placeholder="agentatlas" aria-label="LangSmith Agent ID" />
                </label>
                <label class="routing-field">
                  <span>Agent 环境</span>
                  <input id="tracing-agent-environment" type="text" maxlength="80" spellcheck="false" placeholder="local" aria-label="LangSmith Agent 环境" />
                </label>
                <label class="routing-field">
                  <span>API Key <em id="tracing-key-state" class="key-state">未配置</em></span>
                  <input id="tracing-api-key" type="password" autocomplete="new-password" placeholder="编辑时留空 = 保持当前 Key 不变" aria-label="LangSmith API Key" />
                </label>
                <label class="routing-field tracing-check-row">
                  <input id="tracing-clear-key" type="checkbox" aria-label="清除已保存的 LangSmith API Key" />
                  <span>清除已保存的 API Key</span>
                </label>
              </section>

              <section class="routing-card">
                <h3>隐私与脱敏</h3>
                <p class="routing-card-sub">脱敏只作用于上报副本，不改变模型实际收到的内容、对话记录或 SSE 输出。</p>
                <label class="routing-field tracing-check-row">
                  <input id="tracing-anonymize" type="checkbox" checked aria-label="上报前脱敏敏感信息" />
                  <span>上报前脱敏手机号、身份证、银行卡和常见凭据</span>
                </label>
                <div id="tracing-warning" class="settings-note tracing-warning" role="status" aria-live="polite"></div>
                <p class="routing-hint">开启即表示允许对话内容发送到 LangSmith。脱敏是护栏，不是数据不出网的保证；生产多租户环境建议保持关闭，或使用隔离的 LangSmith workspace。</p>
              </section>
            </div>

            <div class="routing-actions">
              <div id="tracing-status" class="settings-status" role="status" aria-live="polite"></div>
              <button id="tracing-save-btn" type="button" class="ui-button ui-button-primary">保存追踪配置</button>
            </div>
          </div>
        </section>
