        <section id="settings-view-users" class="settings-view hidden" data-settings-panel="users" role="tabpanel" aria-labelledby="users-title">
          <div id="users-panel" class="routing-page" role="region" aria-labelledby="users-title">
            <div class="routing-head">
              <div>
                <span class="routing-kicker"><i class="ui-icon" data-icon="User" aria-hidden="true"></i> Access</span>
                <h2 id="users-title"><i class="ui-icon" data-icon="User" aria-hidden="true"></i> 账号与安全</h2>
              </div>
              <span class="settings-note" id="users-mode-note"></span>
            </div>

            <div class="routing-grid">
              <section class="routing-card" data-pg-only="true" hidden>
                <h3>用户列表</h3>
                <p class="routing-card-sub">创建后的用户用「用户名 + 密码」登录；重置密码会生成一次性临时密码并要求首登修改。</p>
                <div id="users-list" role="table" aria-label="用户列表"></div>
                <div id="users-status" class="settings-status" role="status" aria-live="polite"></div>
              </section>

              <section class="routing-card" data-pg-only="true" hidden>
                <h3>创建用户</h3>
                <p class="routing-card-sub">用户名 3-32 位字母数字；初始密码至少 10 位，用户首登时会被强制修改。</p>
                <label class="routing-field">
                  <span>用户名</span>
                  <input id="users-new-username" type="text" maxlength="32" spellcheck="false" autocomplete="off" placeholder="alice" aria-label="新用户用户名" />
                </label>
                <label class="routing-field">
                  <span>显示名</span>
                  <input id="users-new-display" type="text" maxlength="60" spellcheck="false" placeholder="张三" aria-label="新用户显示名" />
                </label>
                <label class="routing-field">
                  <span>初始密码</span>
                  <input id="users-new-password" type="password" autocomplete="new-password" placeholder="至少 10 位" aria-label="新用户初始密码" />
                </label>
                <label class="routing-field">
                  <span>角色</span>
                  <select id="users-new-role" aria-label="新用户角色">
                    <option value="member">成员（member）</option>
                    <option value="admin">管理员（admin）</option>
                  </select>
                </label>
                <div class="routing-actions">
                  <button id="users-create-btn" type="button" class="ui-button ui-button-primary">创建用户</button>
                </div>
              </section>

              <section class="routing-card" data-pg-only="true" hidden>
                <h3>访问令牌</h3>
                <p class="routing-card-sub">给脚本 / 自动化用的一次性展示令牌；对应所选用户的 <code>auth_tokens</code>。</p>
                <label class="routing-field">
                  <span>目标用户</span>
                  <select id="users-token-user" aria-label="令牌目标用户"></select>
                </label>
                <label class="routing-field">
                  <span>备注</span>
                  <input id="users-token-label" type="text" maxlength="60" placeholder="agent-bench" aria-label="令牌备注" />
                </label>
                <label class="routing-field">
                  <span>有效期（天，留空 = 永久）</span>
                  <input id="users-token-days" type="number" min="1" max="3650" placeholder="90" aria-label="令牌有效天数" />
                </label>
                <div class="routing-actions">
                  <button id="users-token-create-btn" type="button" class="ui-button ui-button-primary">生成令牌</button>
                  <button id="users-token-refresh-btn" type="button" class="ui-button">刷新列表</button>
                </div>
                <div id="users-token-out" class="settings-note" role="status" aria-live="polite"></div>
                <div id="users-token-list" role="table" aria-label="令牌列表"></div>
              </section>

              <section class="routing-card" data-pg-only="true" hidden>
                <h3>我的密码</h3>
                <p class="routing-card-sub">修改密码后所有会话与设备免登都会失效，需要重新登录。</p>
                <label class="routing-field">
                  <span>当前密码（未设过密码可留空）</span>
                  <input id="users-pass-current" type="password" autocomplete="current-password" aria-label="当前密码" />
                </label>
                <label class="routing-field">
                  <span>新密码（至少 10 位）</span>
                  <input id="users-pass-new" type="password" autocomplete="new-password" aria-label="新密码" />
                </label>
                <label class="routing-field">
                  <span>确认新密码</span>
                  <input id="users-pass-confirm" type="password" autocomplete="new-password" aria-label="确认新密码" />
                </label>
                <div class="routing-actions">
                  <button id="users-pass-save-btn" type="button" class="ui-button ui-button-primary">修改密码</button>
                </div>
                <div id="users-pass-status" class="settings-status" role="status" aria-live="polite"></div>
              </section>

              <section class="routing-card hidden" data-file-only="true">
                <h3>本地访问密码锁</h3>
                <p class="routing-card-sub">单用户模式的访问锁：设置后，新设备配对需要输入访问密码（AUTH_TOKEN 仍是救援通道）。忘记密码可在本机运行 <code>npm run lock:clear</code> 解锁。</p>
                <div id="users-lock-state" class="settings-note" role="status" aria-live="polite"></div>
                <label class="routing-field">
                  <span>当前密码（未设锁可留空）</span>
                  <input id="users-lock-current" type="password" autocomplete="current-password" aria-label="当前访问密码" />
                </label>
                <label class="routing-field">
                  <span>新访问密码（至少 10 位）</span>
                  <input id="users-lock-new" type="password" autocomplete="new-password" aria-label="新访问密码" />
                </label>
                <div class="routing-actions">
                  <button id="users-lock-set-btn" type="button" class="ui-button ui-button-primary">设置 / 更新密码锁</button>
                  <button id="users-lock-clear-btn" type="button" class="ui-button ui-button-danger">清除密码锁</button>
                </div>
                <div id="users-lock-status" class="settings-status" role="status" aria-live="polite"></div>
              </section>
            </div>
          </div>
        </section>
