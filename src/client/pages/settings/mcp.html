        <section id="settings-view-mcp" class="settings-view hidden" data-settings-panel="mcp" role="tabpanel" aria-labelledby="mcp-title">
          <div id="mcp-page" class="mcp-page" role="region" aria-labelledby="mcp-title">
            <div class="mcp-page-head">
              <div>
                <h2 id="mcp-title"><i class="ui-icon" data-icon="Server" aria-hidden="true"></i> MCP Servers</h2>
              </div>
              <span id="mcp-summary" class="mcp-summary">共 0 个服务器</span>
            </div>

            <div class="field-label mcp-section-label">导入设置</div>
            <section class="mcp-import-card" aria-labelledby="mcp-import-title">
              <div class="mcp-import-copy">
                <div class="mcp-import-title-row">
                  <h3 id="mcp-import-title">启用 MCP 工具</h3>
                  <span id="mcp-global-state" class="mcp-state-pill">已启用</span>
                </div>
                <p>关闭后暂停所有 MCP 连接和工具注入，但保留服务器配置，便于故障时快速止损。</p>
              </div>
              <div class="mcp-import-actions">
                <button id="mcp-import-btn" type="button" class="ghost-btn small">
                  <i class="ui-icon" data-icon="Upload" aria-hidden="true"></i> 导入 .mcp.json
                </button>
                <label class="mcp-switch" title="全局启用或暂停 MCP">
                  <input id="mcp-global-enabled" type="checkbox" aria-label="启用 MCP 工具" />
                  <span class="mcp-switch-track" aria-hidden="true"></span>
                </label>
              </div>
            </section>
            <input id="mcp-import-file" class="hidden" type="file" accept=".json,application/json" aria-label="选择 MCP JSON 配置" />

            <div class="field-label mcp-section-label">已配置的 MCP Servers</div>
            <section class="mcp-server-panel" aria-labelledby="mcp-servers-title">
              <div class="mcp-server-head">
                <div>
                  <h3 id="mcp-servers-title">MCP Servers 管理</h3>
                  <p>查看连接状态、测试工具，并为每个服务器单独启停。</p>
                </div>
                <div class="mcp-server-actions">
                  <button id="mcp-refresh-btn" type="button" class="mcp-icon-btn" aria-label="刷新 MCP 服务器" title="刷新 MCP 服务器">
                    <i class="ui-icon" data-icon="RefreshCw" aria-hidden="true"></i>
                  </button>
                  <button id="mcp-add-btn" type="button" class="ghost-btn small mcp-add-btn">
                    <i class="ui-icon" data-icon="Plus" aria-hidden="true"></i> 添加
                  </button>
                </div>
              </div>
              <div id="mcp-list" class="mcp-server-list"></div>
            </section>
            <div id="mcp-status" class="settings-status" role="status" aria-live="polite"></div>
          </div>

          <div id="mcp-editor-mask" class="mcp-editor-mask hidden">
            <div id="mcp-editor" class="mcp-editor" role="dialog" aria-modal="true" aria-labelledby="mcp-editor-title">
              <div class="mcp-editor-head">
                <div>
                  <h2 id="mcp-editor-title">添加 MCP Server</h2>
                  <p id="mcp-editor-sub">配置本机 stdio 启动命令；保存后可测试连接并查看远端工具。</p>
                </div>
                <button id="mcp-editor-close" type="button" class="mcp-icon-btn" aria-label="关闭 MCP 编辑器" title="关闭">
                  <i class="ui-icon" data-icon="X" aria-hidden="true"></i>
                </button>
              </div>

              <section class="mcp-quick-command" aria-labelledby="mcp-quick-command-label">
                <label class="field">
                  <span id="mcp-quick-command-label" class="field-label">完整启动命令 <em class="key-state">粘贴后自动拆分，支持 $ 前缀与引号</em></span>
                  <div class="mcp-command-parse-row">
                    <input id="mcp-command-line" aria-label="完整 MCP 启动命令" type="text" spellcheck="false" autocomplete="off" placeholder="$ npx -y @modelcontextprotocol/server-postgres postgresql://user:pass@host:5432/db" />
                    <button id="mcp-command-parse" type="button" class="ghost-btn small">解析</button>
                  </div>
                  <small class="mcp-command-hint">只做命令与参数拆分，不执行命令；Windows 下 npx/npm/pnpm 会自动兼容 .cmd。</small>
                </label>
                <div id="mcp-command-preview" class="mcp-command-preview hidden">
                  <span>解析结果</span>
                  <code id="mcp-command-preview-text"></code>
                </div>
              </section>
              <div class="mcp-form-divider"><span>或手动编辑</span></div>

              <div class="mcp-form-grid">
                <label class="field">
                  <span class="field-label">服务器标识</span>
                  <input id="mcp-id" aria-label="MCP 服务器标识" type="text" spellcheck="false" placeholder="例如 filesystem" />
                </label>
                <label class="field">
                  <span class="field-label">显示名称</span>
                  <input id="mcp-name" aria-label="MCP 服务器名称" type="text" spellcheck="false" placeholder="留空则使用标识" />
                </label>
              </div>
              <label class="field">
                <span class="field-label">可执行命令</span>
                <input id="mcp-command" aria-label="MCP 启动命令" type="text" spellcheck="false" placeholder="例如 npx、node、uvx" />
              </label>
              <label class="field">
                <span class="field-label">命令参数 <em class="key-state">空格分隔；含空格的参数请用双引号包住</em></span>
                <input id="mcp-args" aria-label="MCP 启动参数" type="text" spellcheck="false" placeholder='例如 -y @modelcontextprotocol/server-filesystem "D:\data"' />
              </label>
              <div id="mcp-cwd-note" class="mcp-advanced-note hidden"></div>
              <label class="mcp-approval-row">
                <span>
                  <strong>调用前需要审批</strong>
                  <small>推荐开启。关闭后该服务器的工具会直接执行，风险由你承担。</small>
                </span>
                <span class="mcp-switch">
                  <input id="mcp-approval" type="checkbox" aria-label="MCP 调用前需要审批" checked />
                  <span class="mcp-switch-track" aria-hidden="true"></span>
                </span>
              </label>
              <div id="mcp-editor-status" class="settings-status" role="status" aria-live="polite"></div>
              <div class="mcp-editor-actions">
                <button id="mcp-editor-delete" type="button" class="ghost-btn small mcp-danger-btn hidden">删除服务器</button>
                <span class="mcp-editor-spacer"></span>
                <button id="mcp-editor-cancel" type="button" class="ghost-btn small">取消</button>
                <button id="mcp-editor-save" type="button" class="ghost-btn small mcp-add-btn">保存服务器</button>
              </div>
            </div>
          </div>
        </section>
