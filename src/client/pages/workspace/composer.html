      <footer id="composer">
        <!-- 待发送附件 chips -->
        <div id="attach-chips" class="attach-chips hidden"></div>
        <!-- Agent 自主执行流程：位于上下文条与输入控制之上；默认折叠，没有 workflow_plan 时完全隐藏 -->
        <details id="workflow-panel" class="workflow-panel hidden">
          <summary class="workflow-summary" aria-label="展开或收起执行流程">
            <span class="workflow-summary-icon"><i class="ui-icon" data-icon="Waypoints" aria-hidden="true"></i></span>
            <span class="workflow-summary-copy">
              <strong>执行流程</strong>
              <span id="workflow-active">准备执行</span>
            </span>
            <span id="workflow-status" class="workflow-status status-running">执行中</span>
            <span id="workflow-count" class="workflow-count">0/0 步</span>
            <span id="workflow-meter" class="workflow-meter" role="progressbar" aria-label="执行流程进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
              <span id="workflow-meter-fill" class="workflow-meter-fill status-running"></span>
            </span>
            <span id="workflow-percent" class="workflow-percent">0%</span>
            <span class="workflow-chevron" aria-hidden="true"><i class="ui-icon" data-icon="ChevronRight"></i></span>
          </summary>
          <div class="workflow-body">
            <div class="workflow-goal-row">
              <span class="workflow-goal-label">目标</span>
              <span id="workflow-goal" class="workflow-goal"></span>
            </div>
            <ol id="workflow-steps" class="workflow-steps" aria-label="执行步骤"></ol>
          </div>
        </details>
        <!-- 上下文容量条：used 取最近主请求 input，分母取窗口扣除输出预留后的输入预算 -->
        <div id="context-bar" class="context-bar hidden">
          <div class="ctx-track"><div id="ctx-fill" class="ctx-fill"></div></div>
          <div class="ctx-meta">
            <span id="ctx-text"></span>
            <span id="ctx-speed" class="ctx-speed hidden"></span>
            <span id="ctx-cache" class="ctx-cache hidden"></span>
          </div>
        </div>
        <!-- 模型 / 思考等级 / 会话权限 快捷切换（ZCode 风格：输入框上方随手切） -->
        <div id="composer-bar">
          <div class="cm-group">
            <button id="cm-model" class="cm-chip" type="button" title="切换模型">
              <span class="cm-ic"><i class="ui-icon" data-icon="Zap" aria-hidden="true"></i></span><span class="cm-text"></span><i class="ui-icon cm-arr" data-icon="ChevronDown" aria-hidden="true"></i>
            </button>
            <div id="cm-model-menu" class="cm-menu hidden"></div>
          </div>
          <div class="cm-group">
            <button id="cm-thinking" class="cm-chip" type="button" title="思考等级（按供应商方言适配）">
              <span class="cm-ic"><i class="ui-icon" data-icon="Brain" aria-hidden="true"></i></span><span class="cm-text"></span><i class="ui-icon cm-arr" data-icon="ChevronDown" aria-hidden="true"></i>
            </button>
            <div id="cm-thinking-menu" class="cm-menu hidden"></div>
          </div>
          <div class="cm-group" id="perm-group">
            <button id="cm-perm" class="cm-chip" type="button" title="会话权限模式：只读 / 审批 / 自主 / 自动">
              <span class="cm-ic"><i class="ui-icon" data-icon="ShieldCheck" aria-hidden="true"></i></span><span class="cm-text"></span><i class="ui-icon cm-arr" data-icon="ChevronDown" aria-hidden="true"></i>
            </button>
            <div id="cm-perm-menu" class="cm-menu hidden"></div>
          </div>
          <div class="cm-spacer"></div>
        </div>
        <div id="input-box">
          <button id="attach-btn" class="attach-btn" title="附加文件：项目文件 / 远程文件夹 / 本地上传">
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <button id="goal-chip" class="goal-chip hidden" type="button" title="连续任务模式：任务未完成会持续执行，直到完成、出错或手动停止；点击退出" aria-label="Goal 连续任务模式，点击退出">
            <i class="ui-icon" data-icon="Target" aria-hidden="true"></i><span class="gi-text">Goal</span>
          </button>
          <textarea id="input" aria-label="给 Agent 发送消息" rows="1" placeholder="给 Agent 发送消息…（Enter 发送 / Shift+Enter 换行）" aria-autocomplete="list" aria-controls="composer-menu" aria-expanded="false" disabled></textarea>
          <div id="composer-menu" class="composer-menu hidden" role="listbox" aria-label="输入辅助"></div>
          <button id="send-btn" class="icon-btn" title="发送" disabled>
            <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
          <button id="stop-btn" class="icon-btn hidden" title="停止生成">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>

      </footer>
