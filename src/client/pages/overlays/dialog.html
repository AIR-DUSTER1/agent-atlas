  <!-- ============ 通用弹窗：自研组件，替代原生 alert / prompt / confirm ============ -->
  <div id="ui-dialog-mask" class="hidden">
    <div id="ui-dialog" role="dialog" aria-modal="true" aria-labelledby="ui-dialog-title" tabindex="-1">
      <h3 id="ui-dialog-title">提示</h3>
      <div id="ui-dialog-msg"></div>
      <div id="ui-dialog-input-row" class="hidden">
        <input id="ui-dialog-input" aria-label="对话框输入内容" type="text" spellcheck="false" autocomplete="off" />
      </div>
      <div id="ui-dialog-actions">
        <button id="ui-dialog-cancel" class="ghost-btn" type="button">取消</button>
        <button id="ui-dialog-ok" class="btn btn-approve" type="button">确定</button>
      </div>
    </div>
  </div>
