  <script>
    (() => {
      // 防闪烁：样式表应用前恢复主题；同时提前识别不支持的 import map 浏览器
      try { if (localStorage.getItem("lg-agent-theme") === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
      if (!HTMLScriptElement.supports || !HTMLScriptElement.supports("importmap")) {
        document.documentElement.dataset.importmapUnsupported = "true";
      }
    })();
  </script>
